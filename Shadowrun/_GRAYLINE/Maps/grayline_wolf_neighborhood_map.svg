<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Grayline East Bank - Wolf Neighborhood Scale Draft</title>
  <desc id="desc">Neighborhood-scale schematic map of the east bank around Front Street and the Siberian Wolf, including Dockside Street, rail spur, industrial frontage, Wolf frontage shops, nearby residential and industrial blocks, and the dock edge.</desc>
  <defs>
    <pattern id="scrapPattern" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#746f65"/>
      <path d="M5 34 L18 12 L33 28 M9 8 L38 38 M2 22 L24 38" stroke="#4a463f" stroke-width="3" fill="none"/>
    </pattern>
    <pattern id="dockDeck" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#8a8071"/>
      <path d="M0 15 H30 M15 0 V30" stroke="#6a6155" stroke-width="1.5"/>
    </pattern>
    <style>
      .bg { fill: #efe9dc; }
      .water { fill: #668fa4; stroke: #334046; stroke-width: 4; }
      .dock { fill: url(#dockDeck); stroke: #302b27; stroke-width: 3; }
      .road { stroke: #3f3f3c; stroke-width: 24; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .avenue { stroke: #5f5b52; stroke-width: 14; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .service { stroke: #756f63; stroke-width: 6; stroke-dasharray: 14 10; fill: none; stroke-linecap: round; }
      .rail { stroke: #292929; stroke-width: 8; fill: none; stroke-dasharray: 22 13; }
      .block { fill: #c7bfae; stroke: #2f2d27; stroke-width: 3; opacity: 0.72; }
      .industrial { fill: #a19b90; stroke: #3d3832; stroke-width: 3; }
      .commercial { fill: #c2aa63; stroke: #4a3e24; stroke-width: 3; }
      .residential { fill: #bca77e; stroke: #4a3e24; stroke-width: 3; }
      .warehouse { fill: #928a7c; stroke: #3d3832; stroke-width: 3; }
      .wolf { fill: #733631; stroke: #2d1714; stroke-width: 4; }
      .shop { fill: #b7afa1; stroke: #3d3832; stroke-width: 3; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #1d1d1b; font-size: 30px; font-weight: 800; letter-spacing: 0; }
      .sub { font-family: Arial, Helvetica, sans-serif; fill: #242424; font-size: 19px; font-weight: 700; letter-spacing: 0; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #242424; font-size: 15px; font-weight: 700; letter-spacing: 0; }
      .tiny { font-family: Arial, Helvetica, sans-serif; fill: #242424; font-size: 12px; font-weight: 700; letter-spacing: 0; }
      .block-id { font-family: Arial, Helvetica, sans-serif; fill: #111; font-size: 28px; font-weight: 900; opacity: .72; }
      .white { fill: #f8f5ec; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1100"/>
  <text x="70" y="70" class="label">GRAYLINE EAST BANK</text>
  <text x="72" y="102" class="sub">Wolf neighborhood scale draft</text>

  <!-- River and dock edge -->
  <rect x="70" y="130" width="190" height="920" class="water"/>
  <text x="95" y="565" class="sub white" transform="rotate(-90 95 565)">DUWAMISH RIVER</text>
  <rect x="260" y="130" width="120" height="920" class="dock"/>
  <rect x="190" y="210" width="130" height="34" rx="3" class="dock"/>
  <rect x="180" y="330" width="150" height="34" rx="3" class="dock"/>
  <rect x="195" y="455" width="125" height="34" rx="3" class="dock"/>
  <rect x="175" y="610" width="155" height="34" rx="3" class="dock"/>
  <rect x="190" y="785" width="135" height="34" rx="3" class="dock"/>
  <text x="275" y="165" class="small white">Grayline Docks</text>

  <!-- Rail and streets -->
  <path d="M430 130 L430 1050" class="rail"/>
  <path d="M535 130 L535 1050" class="road"/>
  <path d="M920 130 L920 1050" class="road"/>
  <path d="M260 210 L1500 210" class="road"/>
  <path d="M535 515 L1500 515" class="avenue"/>
  <path d="M535 790 L1500 790" class="avenue"/>
  <path d="M620 355 L885 355" class="service"/>
  <path d="M620 660 L885 660" class="service"/>
  <path d="M995 355 L1445 355" class="service"/>
  <path d="M995 660 L1445 660" class="service"/>

  <!-- Block fields -->
  <rect x="570" y="240" width="330" height="250" rx="4" class="block"/>
  <rect x="955" y="240" width="500" height="250" rx="4" class="block"/>
  <rect x="570" y="545" width="330" height="245" rx="4" class="block"/>
  <rect x="955" y="545" width="500" height="245" rx="4" class="block"/>
  <rect x="570" y="820" width="330" height="175" rx="4" class="block"/>
  <rect x="955" y="820" width="500" height="175" rx="4" class="block"/>

  <!-- E1/E3/E5 west industrial and east commercial/residential tests -->
  <rect x="585" y="255" width="145" height="220" rx="3" class="industrial"/>
  <rect x="730" y="255" width="155" height="220" rx="3" class="commercial"/>
  <rect x="585" y="560" width="145" height="215" rx="3" class="industrial"/>
  <rect x="730" y="560" width="155" height="215" rx="3" class="commercial"/>
  <rect x="585" y="835" width="300" height="145" rx="3" class="industrial"/>
  <rect x="970" y="560" width="470" height="215" rx="3" class="residential"/>
  <rect x="970" y="835" width="470" height="80" rx="3" fill="#a69a77" stroke="#4a3e24" stroke-width="3"/>
  <rect x="970" y="915" width="470" height="65" rx="3" class="industrial"/>

  <!-- E2 scrapyard candidate -->
  <rect x="970" y="255" width="470" height="220" rx="3" fill="url(#scrapPattern)" stroke="#3d3832" stroke-width="3"/>

  <!-- Wolf frontage on Front Street -->
  <rect x="945" y="235" width="150" height="35" rx="3" class="shop"/>
  <rect x="945" y="278" width="150" height="35" rx="3" class="shop"/>
  <rect x="945" y="321" width="150" height="35" rx="3" class="warehouse"/>
  <rect x="945" y="364" width="150" height="44" rx="3" class="wolf"/>
  <rect x="945" y="416" width="150" height="35" rx="3" class="shop"/>
  <rect x="945" y="459" width="150" height="35" rx="3" class="shop"/>
  <rect x="945" y="502" width="150" height="44" rx="3" fill="#657e75" stroke="#263b35" stroke-width="3"/>
  <circle cx="965" cy="565" r="9" fill="#263b35"/>
  <rect x="982" y="558" width="46" height="14" rx="2" fill="#263b35"/>

  <!-- Labels -->
  <text x="392" y="155" class="small">Grayline Rail Spur</text>
  <text x="552" y="155" class="small">Dockside Street</text>
  <text x="940" y="155" class="small">Front Street</text>
  <text x="1020" y="195" class="small">East Bridge Avenue</text>
  <text x="1030" y="505" class="small">East Anchor Avenue</text>
  <text x="1030" y="780" class="small">East Port Avenue</text>

  <text x="605" y="292" class="block-id">E1</text>
  <text x="990" y="292" class="block-id">E2</text>
  <text x="605" y="600" class="block-id">E3</text>
  <text x="990" y="600" class="block-id">E4</text>
  <text x="605" y="875" class="block-id">E7</text>
  <text x="990" y="875" class="block-id">E8</text>
  <text x="600" y="455" class="tiny">west industrial / east commercial</text>
  <text x="1010" y="455" class="tiny white">scrapyard / industrial junkyard</text>
  <text x="600" y="755" class="tiny">west industrial / east commercial</text>
  <text x="1010" y="755" class="tiny">residential apartments</text>
  <text x="600" y="960" class="tiny">all industrial</text>
  <text x="1010" y="895" class="tiny">north squatter residential</text>
  <text x="1010" y="960" class="tiny white">south industrial</text>

  <text x="968" y="259" class="tiny">Garage</text>
  <text x="968" y="302" class="tiny">Freight Office</text>
  <text x="968" y="345" class="tiny white">Small Warehouse</text>
  <text x="970" y="390" class="tiny white">Siberian Wolf</text>
  <text x="968" y="440" class="tiny">Storage + Apts</text>
  <text x="968" y="483" class="tiny">Welder</text>
  <text x="968" y="526" class="tiny white">Electronics Repair</text>
</svg>
