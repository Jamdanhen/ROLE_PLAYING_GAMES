<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Seattle 2057 Grayline Docks District Map</title>
  <desc id="desc">Black-and-white operational district map of Grayline Docks in Tacoma Industrial District, including the Duwamish River, Burnout territory, bridge, cargo pier, container maze, Wolf Block, Siberian Wolf, Stuffer Shack, and southern Brigata 12 territorial edge.</desc>
  <defs>
    <pattern id="hex" width="52" height="45" patternUnits="userSpaceOnUse">
      <path d="M13 0 L39 0 L52 22.5 L39 45 L13 45 L0 22.5 Z" fill="none" stroke="#d8d8d8" stroke-width="1"/>
    </pattern>
    <pattern id="burnoutHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#9a9a9a" stroke-width="3"/>
    </pattern>
    <pattern id="dockControl" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#c8c8c8" stroke-width="2"/>
    </pattern>
    <pattern id="containerLines" width="34" height="24" patternUnits="userSpaceOnUse">
      <rect width="34" height="24" fill="#ededed"/>
      <rect x="3" y="3" width="28" height="18" fill="none" stroke="#a8a8a8" stroke-width="1.5"/>
      <line x1="12" y1="3" x2="12" y2="21" stroke="#a8a8a8" stroke-width="1"/>
      <line x1="22" y1="3" x2="22" y2="21" stroke="#a8a8a8" stroke-width="1"/>
    </pattern>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
    </filter>
    <style>
      .paper { fill:#fafafa; }
      .ink { fill:#111; }
      .panel { fill:#f9f9f9; stroke:#111; stroke-width:1.4; }
      .panel-rule { stroke:#111; stroke-width:1.1; }
      .thin { stroke:#777; stroke-width:1; fill:none; }
      .district-border { stroke:#111; stroke-width:4; fill:none; }
      .district-fill { fill:#f6f6f6; stroke:#111; stroke-width:2; }
      .water { fill:#dce4e6; stroke:#111; stroke-width:2; }
      .water-line { stroke:#aab7bb; stroke-width:1.2; fill:none; opacity:.75; }
      .road { stroke:#111; stroke-width:5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .road2 { stroke:#777; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .road3 { stroke:#aaa; stroke-width:1.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .service { stroke:#111; stroke-width:2; stroke-dasharray:4 5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .rail { stroke:#111; stroke-width:2.2; fill:none; stroke-dasharray:8 7; }
      .building { fill:#d5d5d5; stroke:#111; stroke-width:1.1; }
      .dock { fill:#e2e2e2; stroke:#111; stroke-width:1.4; }
      .container { fill:url(#containerLines); stroke:#111; stroke-width:1.2; }
      .label { font-family:Arial, Helvetica, sans-serif; fill:#111; font-weight:800; letter-spacing:0; }
      .regular { font-family:Arial, Helvetica, sans-serif; fill:#111; font-weight:400; letter-spacing:0; }
      .h1 { font-size:36px; }
      .h2 { font-size:27px; }
      .h3 { font-size:19px; }
      .body { font-size:15px; }
      .tiny { font-size:12px; }
      .micro { font-size:10px; }
      .callout { fill:#111; }
      .calloutText { font-family:Arial, Helvetica, sans-serif; fill:#fff; font-size:18px; font-weight:800; text-anchor:middle; dominant-baseline:central; }
      .legendText { font-family:Arial, Helvetica, sans-serif; fill:#111; font-size:13px; font-weight:700; letter-spacing:0; }
      .noteText { font-family:Arial, Helvetica, sans-serif; fill:#111; font-size:14px; font-weight:400; letter-spacing:0; }
      .arrow { stroke:#111; stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect width="1536" height="1024" class="paper"/>
  <rect width="1536" height="1024" fill="url(#hex)" opacity=".8"/>
  <rect width="1536" height="1024" filter="url(#paper)" opacity=".55"/>

