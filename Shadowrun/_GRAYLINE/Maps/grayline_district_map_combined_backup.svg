  <!-- Top right title card -->
  <rect x="1218" y="6" width="318" height="212" class="panel"/>
  <text x="1238" y="55" class="label" font-size="29">GRAYLINE DOCKS</text>
  <text x="1241" y="81" class="label" font-size="15">TACOMA INDUSTRIAL DISTRICT</text>
  <text x="1240" y="114" class="regular body">Semi-functional dock district on the</text>
  <text x="1240" y="137" class="regular body">edge of the Tacoma Barrens.</text>
  <text x="1240" y="160" class="regular body">Legit business overlaps with smuggling.</text>
  <text x="1240" y="183" class="regular body">Violence exists, but is controlled.</text>

  <!-- District notes -->
  <rect x="1175" y="856" width="337" height="145" class="panel"/>
  <text x="1267" y="880" class="label body">DISTRICT NOTES</text>
  <line x1="1188" y1="891" x2="1498" y2="891" class="panel-rule"/>
  <text x="1188" y="916" class="noteText">• Dock Coalition controls docks and shipping.</text>
  <text x="1188" y="939" class="noteText">• Siberian Wolf Krew enforces smuggling lanes.</text>
  <text x="1188" y="962" class="noteText">• Burnout Gang operates on the west edge.</text>
  <text x="1188" y="985" class="noteText">• Violence is controlled until it isn’t.</text>
</svg>
