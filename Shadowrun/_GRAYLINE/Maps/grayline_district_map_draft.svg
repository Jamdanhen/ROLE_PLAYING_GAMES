<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="-120 -80 1840 1260" role="img" aria-labelledby="title desc">
  <title id="title">Grayline District Grid Draft</title>
  <desc id="desc">Clean schematic grid draft of Grayline District, divided by the Duwamish River, with west and east street grids, docks, cargo pier, container maze, Wolf frontage, and temporary W and E block IDs.</desc>
  <defs>
    <pattern id="containerPattern" width="48" height="32" patternUnits="userSpaceOnUse">
      <rect width="48" height="32" fill="#8f9a9a"/>
      <rect x="3" y="3" width="42" height="26" fill="none" stroke="#596363" stroke-width="2"/>
      <line x1="12" y1="3" x2="12" y2="29" stroke="#596363" stroke-width="1"/>
      <line x1="24" y1="3" x2="24" y2="29" stroke="#596363" stroke-width="1"/>
      <line x1="36" y1="3" x2="36" y2="29" stroke="#596363" stroke-width="1"/>
    </pattern>
    <pattern id="scrapPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#736c63"/>
      <path d="M5 30 L18 12 L30 24 M10 8 L34 36 M2 20 L20 34" stroke="#4d4741" stroke-width="3" fill="none"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <style>
      .bg { fill: #efe9dc; }
      .water { fill: #668fa4; }
      .water-line { stroke: #416675; stroke-width: 5; fill: none; opacity: 0.55; }
      .shore { stroke: #334046; stroke-width: 8; fill: none; opacity: 0.35; }
      .bank-west { fill: #9d8b7a; opacity: 0.34; stroke: #493d33; stroke-width: 3; }
      .bank-east { fill: #a9a797; opacity: 0.38; stroke: #3f463c; stroke-width: 3; }
      .road { stroke: #3f3f3c; stroke-width: 20; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .avenue { stroke: #5f5b52; stroke-width: 10; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .rail { stroke: #292929; stroke-width: 7; fill: none; stroke-dasharray: 20 12; }
      .dock { fill: #8a8071; stroke: #322d28; stroke-width: 3; }
      .building { fill: #b7afa1; stroke: #3d3832; stroke-width: 3; }
      .commercial { fill: #c0a25d; stroke: #4a3e24; stroke-width: 3; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #1d1d1b; font-size: 28px; font-weight: 700; letter-spacing: 0; }
      .sub { font-family: Arial, Helvetica, sans-serif; fill: #242424; font-size: 18px; font-weight: 600; letter-spacing: 0; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #242424; font-size: 15px; font-weight: 600; letter-spacing: 0; }
      .tiny { font-family: Arial, Helvetica, sans-serif; fill: #242424; font-size: 13px; font-weight: 600; letter-spacing: 0; }
      .block-id { font-family: Arial, Helvetica, sans-serif; fill: #161616; font-size: 24px; font-weight: 800; opacity: 0.8; }
      .white { fill: #f8f5ec; }
      .limit { stroke: #a32727; stroke-width: 8; stroke-dasharray: 20 14; fill: none; }
      .limit-label { fill: #8b1f1f; font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 800; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1100"/>

  <!-- Duwamish River -->
  <path d="M665 -30 C620 120 690 220 650 360 C605 520 700 660 655 815 C620 940 675 1030 650 1130 L820 1130 C855 980 795 900 835 760 C875 620 790 500 835 350 C875 205 795 105 835 -30 Z" class="water"/>
  <path d="M715 20 C690 170 735 280 710 420 C685 565 750 690 720 850 C700 955 735 1030 720 1090" class="water-line"/>
  <path d="M655 -20 C620 120 690 220 650 360 C605 520 700 660 655 815 C620 940 675 1030 650 1120" class="shore"/>
  <path d="M830 -20 C870 130 795 230 835 360 C880 510 790 630 835 760 C875 900 795 990 820 1120" class="shore"/>

  <!-- Bank fields -->
  <rect x="65" y="145" width="520" height="820" rx="4" class="bank-west"/>
  <rect x="875" y="145" width="655" height="820" rx="4" class="bank-east"/>

  <!-- Bridge and rail crossing -->
  <path d="M65 300 L1525 300" class="road" filter="url(#shadow)"/>
  <path d="M505 300 L1015 300" stroke="#777064" stroke-width="24" fill="none" stroke-linecap="round"/>
  <path d="M65 300 L1525 300" stroke="#777064" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M505 276 L1015 276" stroke="#3a3630" stroke-width="4" fill="none"/>
  <path d="M505 324 L1015 324" stroke="#3a3630" stroke-width="4" fill="none"/>
  <path d="M65 338 L1032 338" class="rail"/>

  <!-- West bank grid -->
  <path d="M245 170 L245 920" class="avenue"/>
  <path d="M405 170 L405 920" class="avenue"/>
  <path d="M90 520 L500 520" class="avenue"/>
  <path d="M90 735 L500 735" class="avenue"/>
  <path d="M90 930 L500 930" class="avenue"/>

  <!-- West bank docks -->
  <rect x="520" y="145" width="58" height="820" rx="3" class="dock"/>
  <rect x="560" y="170" width="98" height="24" rx="2" class="dock"/>
  <rect x="548" y="250" width="92" height="24" rx="2" class="dock"/>
  <rect x="560" y="340" width="88" height="24" rx="2" class="dock"/>
  <rect x="548" y="455" width="104" height="24" rx="2" class="dock"/>
  <rect x="560" y="585" width="92" height="24" rx="2" class="dock"/>
  <rect x="548" y="710" width="104" height="24" rx="2" class="dock"/>
  <rect x="560" y="850" width="86" height="24" rx="2" class="dock"/>

  <!-- West bank placed venues -->
  <rect x="255" y="175" width="135" height="95" rx="3" class="commercial"/>
  <rect x="425" y="175" width="82" height="95" rx="3" class="building"/>
  <rect x="105" y="775" width="135" height="145" rx="3" class="building"/>
  <path d="M120 900 L165 800 L190 885 L225 795" stroke="#6e261f" stroke-width="10" fill="none"/>

  <!-- East bank docks and roads -->
  <rect x="850" y="145" width="125" height="155" rx="3" class="dock"/>
  <rect x="815" y="165" width="115" height="24" rx="2" class="dock"/>
  <rect x="805" y="220" width="125" height="24" rx="2" class="dock"/>
  <rect x="820" y="270" width="110" height="24" rx="2" class="dock"/>
  <rect x="870" y="320" width="155" height="355" rx="3" class="dock"/>
  <rect x="810" y="340" width="150" height="28" rx="2" class="dock"/>
  <rect x="820" y="415" width="160" height="28" rx="2" class="dock"/>
  <rect x="815" y="520" width="170" height="28" rx="2" class="dock"/>
  <rect x="820" y="610" width="150" height="28" rx="2" class="dock"/>
  <path d="M1032 145 L1032 1070" class="rail"/>
  <path d="M1092 145 L1092 930" class="road"/>
  <path d="M1330 145 L1330 930" class="avenue"/>
  <path d="M1092 520 L1500 520" class="avenue"/>
  <path d="M1092 735 L1500 735" class="avenue"/>
  <path d="M1092 930 L1500 930" class="avenue"/>

  <!-- Wolf frontage shops -->
  <rect x="1368" y="310" width="138" height="20" rx="3" fill="#9c9688" stroke="#3d3832" stroke-width="3"/>
  <rect x="1368" y="335" width="138" height="20" rx="3" fill="#b7afa1" stroke="#3d3832" stroke-width="3"/>
  <rect x="1368" y="360" width="138" height="20" rx="3" fill="#8f8879" stroke="#3d3832" stroke-width="3"/>
  <rect x="1368" y="385" width="138" height="28" rx="3" fill="#733631" stroke="#2d1714" stroke-width="4"/>
  <rect x="1368" y="418" width="138" height="20" rx="3" fill="#8b806d" stroke="#3d3832" stroke-width="3"/>
  <rect x="1368" y="443" width="138" height="20" rx="3" fill="#806f5f" stroke="#3d3832" stroke-width="3"/>
  <rect x="1368" y="468" width="138" height="28" rx="3" fill="#657e75" stroke="#263b35" stroke-width="3"/>
  <circle cx="1392" cy="507" r="8" fill="#263b35"/>
  <rect x="1406" y="501" width="38" height="12" rx="2" fill="#263b35"/>

  <!-- Cargo pier and container maze -->
  <rect x="820" y="675" width="267" height="255" rx="4" fill="#7e7568" stroke="#2f2924" stroke-width="4"/>
  <rect x="760" y="700" width="105" height="24" rx="2" class="dock"/>
  <rect x="775" y="765" width="90" height="24" rx="2" class="dock"/>
  <rect x="745" y="835" width="120" height="24" rx="2" class="dock"/>
  <rect x="770" y="895" width="95" height="24" rx="2" class="dock"/>
  <rect x="875" y="930" width="650" height="120" rx="4" fill="url(#containerPattern)" stroke="#2f3737" stroke-width="4"/>
  <path d="M925 950 C995 1010 1060 952 1135 1018 C1200 1075 1285 980 1360 1028 C1415 1062 1460 1015 1510 1040" stroke="#f2e8cc" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M805 1070 L1525 1070" class="limit"/>

  <!-- Labels -->
  <text x="70" y="70" class="label" font-size="42">GRAYLINE DISTRICT</text>
  <text x="72" y="104" class="sub">Tacoma Industrial Sector - clean grid draft</text>
  <text x="675" y="515" class="label white" transform="rotate(-86 675 515)">DUWAMISH RIVER</text>
  <text x="145" y="277" class="small">West Bridge Avenue</text>
  <text x="1065" y="277" class="small">East Bridge Avenue</text>
  <text x="95" y="185" class="label">WEST BANK</text>
  <text x="97" y="212" class="sub">Burnout territory</text>
  <text x="210" y="166" class="tiny">Foundry Street</text>
  <text x="372" y="166" class="tiny">Ash Street</text>
  <text x="92" y="509" class="tiny">West Anchor Avenue</text>
  <text x="92" y="724" class="tiny">West Port Avenue</text>
  <text x="92" y="918" class="tiny">West Beach Avenue</text>
  <text x="445" y="175" class="small">West Side Docks</text>
  <text x="268" y="210" class="tiny">Stuffer Shack</text>
  <text x="268" y="230" class="tiny">Liquor / Pawn</text>
  <text x="432" y="215" class="tiny">Repair Yard</text>
  <text x="118" y="855" class="tiny">Burnout</text>
  <text x="118" y="875" class="tiny">Burned</text>
  <text x="118" y="895" class="tiny">Warehouse</text>
  <text x="910" y="185" class="label">EAST BANK</text>
  <text x="882" y="205" class="small white">North River</text>
  <text x="882" y="228" class="small white">Docks</text>
  <text x="896" y="365" class="sub white">Grayline</text>
  <text x="896" y="393" class="sub white">Docks</text>
  <text x="1048" y="318" class="small">Grayline Rail Spur</text>
  <text x="1110" y="348" class="small">Dockside Street</text>
  <text x="1298" y="289" class="tiny">Front Street</text>
  <text x="1128" y="509" class="tiny">East Anchor Avenue</text>
  <text x="1128" y="724" class="tiny">East Port Avenue</text>
  <text x="1128" y="918" class="tiny">East Beach Avenue</text>
  <text x="1384" y="325" class="tiny white">Garage</text>
  <text x="1384" y="350" class="tiny">Freight Office</text>
  <text x="1384" y="375" class="tiny white">Small Warehouse</text>
  <text x="1390" y="399" class="tiny white">Siberian</text>
  <text x="1408" y="410" class="tiny white">Wolf</text>
  <text x="1384" y="433" class="tiny white">Storage + Apts</text>
  <text x="1384" y="458" class="tiny white">Welder</text>
  <text x="1382" y="481" class="tiny white">Electronics</text>
  <text x="1382" y="492" class="tiny white">Repair</text>
  <text x="895" y="730" class="sub white">Cargo Pier</text>
  <text x="905" y="985" class="label white">CONTAINER MAZE</text>
  <text x="905" y="910" class="limit-label">BRIGATA 12 TERRITORIAL LIMIT INCLUDES CONTAINER MAZE</text>

  <!-- Temporary block IDs -->
  <text x="145" y="255" class="block-id">W1</text>
  <text x="320" y="255" class="block-id">W2</text>
  <text x="455" y="255" class="block-id">W3</text>
  <text x="145" y="430" class="block-id">W4</text>
  <text x="320" y="430" class="block-id">W5</text>
  <text x="455" y="430" class="block-id">W6</text>
  <text x="145" y="635" class="block-id">W7</text>
  <text x="320" y="635" class="block-id">W8</text>
  <text x="455" y="635" class="block-id">W9</text>
  <text x="135" y="835" class="block-id">W10</text>
  <text x="310" y="835" class="block-id">W11</text>
  <text x="445" y="835" class="block-id">W12</text>
  <text x="1200" y="235" class="block-id">E1</text>
  <text x="1378" y="235" class="block-id">E2</text>
  <text x="1200" y="430" class="block-id">E3</text>
  <text x="1378" y="430" class="block-id">E4</text>
  <text x="1200" y="635" class="block-id">E5</text>
  <text x="1390" y="635" class="block-id">E6</text>
  <text x="1200" y="835" class="block-id">E7</text>
