<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Startup Sequence</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050607;
      --panel: rgba(7, 11, 13, 0.88);
      --line: rgba(118, 255, 197, 0.22);
      --text: #aef7d2;
      --muted: #5bb991;
      --warn: #ffcf71;
      --hot: #ff7c7c;
      --blue: #7cc7ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 15%, rgba(124, 199, 255, 0.08), transparent 28%),
        radial-gradient(circle at 82% 75%, rgba(174, 247, 210, 0.07), transparent 30%),
        linear-gradient(135deg, #040505 0%, #08100d 48%, #050607 100%);
      color: var(--text);
      font-family: "Consolas", "Cascadia Mono", "Courier New", monospace;
    }

    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      background:
        linear-gradient(rgba(255, 255, 255, 0.025) 50%, transparent 50%) 0 0 / 100% 4px,
        linear-gradient(90deg, rgba(174, 247, 210, 0.035), transparent 12%, transparent 88%, rgba(124, 199, 255, 0.03));
      mix-blend-mode: screen;
    }

    body::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.36) 72%, rgba(0, 0, 0, 0.72) 100%);
    }

    main {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(420px, 0.74fr) minmax(280px, 0.46fr);
      gap: 24px;
      width: min(1280px, calc(100vw - 48px));
      height: min(780px, calc(100vh - 48px));
      margin: 24px auto;
    }

    .terminal,
    .swarm {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      box-shadow:
        0 0 0 1px rgba(174, 247, 210, 0.05) inset,
        0 24px 80px rgba(0, 0, 0, 0.45);
    }

    .terminal {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .terminal::before,
    .swarm::before {
      position: absolute;
      inset: 0;
      content: "";
      background:
        linear-gradient(90deg, rgba(174, 247, 210, 0.08) 1px, transparent 1px) 0 0 / 64px 64px,
        linear-gradient(rgba(174, 247, 210, 0.06) 1px, transparent 1px) 0 0 / 64px 64px;
      opacity: 0.22;
      pointer-events: none;
    }

    .terminal-header {
      display: none;
    }

    .stream {
      position: relative;
      z-index: 2;
      min-height: 0;
      flex: 1 1 auto;
      padding: 18px 22px 26px;
      overflow: hidden;
      font-size: clamp(12px, 1.15vw, 16px);
      line-height: 1.45;
    }

    .line {
      min-height: 1.45em;
      white-space: pre-wrap;
      text-shadow: 0 0 14px rgba(174, 247, 210, 0.26);
      opacity: 0;
      transform: translateY(8px);
      animation: line-in 260ms ease-out forwards;
    }

    .line.warn {
      color: var(--warn);
      text-shadow: 0 0 18px rgba(255, 207, 113, 0.36);
      animation: line-in 260ms ease-out forwards, fault 160ms steps(2, end) 2;
    }

    .line.hot {
      color: var(--hot);
      text-shadow: 0 0 18px rgba(255, 124, 124, 0.38);
    }

    .line.blue {
      color: var(--blue);
      text-shadow: 0 0 18px rgba(124, 199, 255, 0.34);
    }

    .cursor::after {
      display: inline-block;
      width: 0.62em;
      height: 1.05em;
      margin-left: 0.16em;
      content: "";
      vertical-align: -0.16em;
      background: var(--text);
      box-shadow: 0 0 18px rgba(174, 247, 210, 0.45);
      animation: blink 740ms steps(1, end) infinite;
    }

    .swarm {
      min-height: 0;
    }

    .route-map {
      position: absolute;
      inset: 16px;
      z-index: 1;
      overflow: hidden;
      border: 1px solid rgba(174, 247, 210, 0.16);
      border-radius: 5px;
      opacity: 0;
      transform: scale(0.985);
      transition: opacity 620ms ease, transform 620ms ease;
    }

    .route-map.visible {
      opacity: 0.82;
      transform: scale(1);
    }

    .route-map svg {
      display: block;
      width: 100%;
      height: 100%;
      background: #07100f;
    }

    .route-map .map-bg {
      fill: #07100f;
    }

    .route-map .water {
      fill: #062329;
      stroke: rgba(124, 199, 255, 0.28);
      stroke-width: 2;
    }

    .route-map .land-line,
    .route-map .mountain {
      fill: none;
      stroke: rgba(174, 247, 210, 0.22);
      stroke-width: 2;
    }

    .route-map .map-grid {
      stroke: rgba(174, 247, 210, 0.1);
      stroke-width: 1;
    }

    .route-map .map-label {
      fill: #aef7d2;
      font: 24px "Consolas", "Cascadia Mono", monospace;
    }

    .route-map .map-small {
      fill: rgba(174, 247, 210, 0.68);
      font: 17px "Consolas", "Cascadia Mono", monospace;
    }

    .route-map .map-node {
      fill: var(--blue);
      filter: drop-shadow(0 0 8px rgba(124, 199, 255, 0.75));
    }

    .route-map .map-lodge {
      fill: var(--warn);
      filter: drop-shadow(0 0 10px rgba(255, 207, 113, 0.75));
    }

    .route-map .trace-base,
    .route-map .trace-out,
    .route-map .trace-back {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .route-map .trace-base {
      stroke: rgba(124, 199, 255, 0.16);
      stroke-width: 9;
    }

    .route-map .trace-out {
      stroke: var(--blue);
      stroke-width: 4;
      stroke-dasharray: 950;
      stroke-dashoffset: 950;
      filter: drop-shadow(0 0 10px rgba(124, 199, 255, 0.75));
    }

    .route-map .trace-back {
      stroke: var(--warn);
      stroke-width: 4;
      stroke-dasharray: 1040;
      stroke-dashoffset: 1040;
      filter: drop-shadow(0 0 10px rgba(255, 207, 113, 0.72));
    }

    .route-map.visible .trace-out {
      animation: route-draw 2.2s ease-out 0.1s forwards;
    }

    .route-map.visible .trace-back {
      animation: route-draw 2.35s ease-out 1.8s forwards;
    }

    .route-map .map-pulse {
      fill: none;
      stroke: rgba(255, 207, 113, 0.66);
      stroke-width: 3;
      opacity: 0;
    }

    .route-map.visible .map-pulse {
      animation: map-pulse 1.35s ease-out 3.5s infinite;
    }

    .surveillance-frame {
      position: absolute;
      inset: 16px;
      z-index: 2;
      overflow: hidden;
      border: 1px solid rgba(174, 247, 210, 0.18);
      border-radius: 5px;
      opacity: 0;
      transform: scale(0.985);
      transition: opacity 900ms ease, transform 900ms ease;
    }

    .surveillance-frame.visible {
      opacity: 0.72;
      transform: scale(1);
      animation: frame-jitter 140ms steps(2, end) 5;
    }

    .surveillance-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(1) contrast(1.16) brightness(0.76);
    }

    .surveillance-frame::before,
    .surveillance-frame::after {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
    }

    .surveillance-frame::before {
      background:
        linear-gradient(rgba(255, 255, 255, 0.035) 50%, rgba(0, 0, 0, 0.18) 50%) 0 0 / 100% 5px,
        radial-gradient(circle at center, transparent 34%, rgba(0, 0, 0, 0.45) 100%);
      mix-blend-mode: screen;
    }

    .surveillance-frame::after {
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow:
        0 0 38px rgba(124, 199, 255, 0.18) inset,
        0 0 32px rgba(0, 0, 0, 0.7) inset;
    }

    .neighborhood-map {
      position: absolute;
      inset: 16px;
      z-index: 4;
      overflow: hidden;
      border: 1px solid rgba(174, 247, 210, 0.22);
      border-radius: 5px;
      background: #060908;
      opacity: 0;
      transform: scale(0.992);
      transition: opacity 720ms ease, transform 720ms ease;
    }

    .neighborhood-map.visible {
      opacity: 0.94;
      transform: scale(1);
    }

    .neighborhood-map img,
    .neighborhood-map svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .neighborhood-map img {
      object-fit: contain;
      filter: grayscale(1) contrast(1.22) brightness(0.72);
      opacity: 0.86;
    }

    .neighborhood-map .dock-zone-fallback {
      background:
        radial-gradient(circle at 76% 60%, rgba(255, 207, 113, 0.08), transparent 18%),
        linear-gradient(135deg, rgba(124, 199, 255, 0.04), rgba(174, 247, 210, 0.03));
    }

    .neighborhood-map .dock-zone-bg {
      fill: #07100f;
    }

    .neighborhood-map .dock-water {
      fill: #062329;
      stroke: rgba(124, 199, 255, 0.22);
      stroke-width: 2;
    }

    .neighborhood-map .dock-block {
      fill: rgba(174, 247, 210, 0.06);
      stroke: rgba(174, 247, 210, 0.22);
      stroke-width: 3;
    }

    .neighborhood-map .dock-gridline {
      stroke: rgba(174, 247, 210, 0.08);
      stroke-width: 1;
    }

    .neighborhood-map .dock-route-base,
    .neighborhood-map .dock-route {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .neighborhood-map .dock-route-base {
      stroke: rgba(124, 199, 255, 0.18);
      stroke-width: 14;
    }

    .neighborhood-map .dock-route {
      stroke: var(--blue);
      stroke-width: 6;
      stroke-dasharray: 1320;
      stroke-dashoffset: 1320;
      filter: drop-shadow(0 0 10px rgba(124, 199, 255, 0.84));
    }

    .neighborhood-map.visible .dock-route {
      animation: dock-route-draw 4.2s ease-in-out 0.28s forwards;
    }

    .neighborhood-map .dock-node {
      fill: var(--blue);
      opacity: 0;
      filter: drop-shadow(0 0 8px rgba(124, 199, 255, 0.8));
    }

    .neighborhood-map.visible .dock-node {
      animation: dock-node-in 240ms ease-out forwards;
    }

    .neighborhood-map.visible .dock-node-1 {
      animation-delay: 0.65s;
    }

    .neighborhood-map.visible .dock-node-2 {
      animation-delay: 1.3s;
    }

    .neighborhood-map.visible .dock-node-3 {
      animation-delay: 2.05s;
    }

    .neighborhood-map.visible .dock-node-4 {
      animation-delay: 2.8s;
    }

    .neighborhood-map .dock-crosshair {
      opacity: 0;
      transform-box: view-box;
      transform-origin: 1186px 596px;
      filter: drop-shadow(0 0 12px rgba(255, 207, 113, 0.9));
    }

    .neighborhood-map.visible .dock-crosshair {
      animation: target-lock 1.15s ease-out 4.55s forwards;
    }

    .neighborhood-map .target-label {
      opacity: 0;
      fill: var(--warn);
      font: 34px "Consolas", "Cascadia Mono", monospace;
      filter: drop-shadow(0 0 8px rgba(255, 207, 113, 0.8));
    }

    .neighborhood-map.visible .target-label {
      animation: label-in 360ms ease-out 5.1s forwards;
    }

    canvas {
      position: absolute;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
    }

    .trace {
      position: absolute;
      right: 18px;
      bottom: 18px;
      left: 18px;
      z-index: 5;
      display: grid;
      gap: 8px;
      color: rgba(174, 247, 210, 0.75);
      font-size: clamp(12px, 1.2vw, 15px);
      text-shadow: 0 0 14px rgba(174, 247, 210, 0.24);
    }

    .trace div {
      min-height: 1.4em;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .trace div.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .panel-shutdown {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.25s ease;
    }

    .panel-shutdown.active {
      opacity: 1;
    }

    @keyframes line-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @keyframes fault {
      50% {
        transform: translateX(3px);
        filter: hue-rotate(32deg);
      }
    }

    @keyframes route-draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes map-pulse {
      0% {
        r: 9;
        opacity: 0.9;
      }

      100% {
        r: 44;
        opacity: 0;
      }
    }

    @keyframes frame-jitter {
      50% {
        transform: translate(2px, -1px) scale(1.006);
        filter: brightness(1.2);
      }
    }

    @keyframes dock-route-draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes dock-node-in {
      to {
        opacity: 1;
      }
    }

    @keyframes target-lock {
      0% {
        opacity: 0;
        transform: scale(1.8) rotate(18deg);
      }

      55% {
        opacity: 1;
        transform: scale(0.92) rotate(0deg);
      }

      72% {
        transform: scale(1.06);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes label-in {
      to {
        opacity: 1;
      }
    }

    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 1.08fr 0.72fr;
        width: calc(100vw - 24px);
        height: calc(100vh - 24px);
        margin: 12px;
        gap: 12px;
      }

      .terminal-header,
      .stream {
        padding-right: 16px;
        padding-left: 16px;
      }
    }
  </style>
</head>

      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      seedNodes(rect.width, rect.height);
    }

    function seedNodes(width, height) {
      nodes.length = 0;
      const count = Math.max(42, Math.floor((width * height) / 4800));
      for (let i = 0; i < count; i += 1) {
        nodes.push({
          x: width * (0.18 + Math.random() * 0.64),
          y: height * (0.15 + Math.random() * 0.66),
          a: Math.random() * Math.PI * 2,
          r: 18 + Math.random() * 110,
          s: 0.003 + Math.random() * 0.008,
          o: Math.random() * 0.5 + 0.32
        });
      }
    }

    function classify(text) {
      if (text.startsWith("WARNING") || text.includes("FAILURE") || text.includes("CORRUPTION")) return "warn";
      if (text.includes("LOCKED") || text.includes("INCOMPLETE") || text.includes("DEGRADED")) return "hot";
      if (text.includes("NODE RESPONSE") || text.includes("SYNCHRONIZATION") || text.includes("ACTIVE CHANNELS")) return "blue";
      return "";
    }

    function revealTrace(text) {
      traceItems.forEach((item) => {
        if (item.textContent === text) item.classList.add("visible");
      });
    }

    function addLine(text) {
      const line = document.createElement("div");
      line.className = `line ${classify(text)}`;
      line.textContent = text;
      stream.appendChild(line);

      const previous = stream.querySelector(".cursor");
      if (previous) previous.classList.remove("cursor");
      line.classList.add("cursor");

      while (stream.children.length > 32) {
        stream.firstElementChild.remove();
      }

      if (text.includes("18%")) stage = Math.max(stage, 1);
      if (text.includes("47%")) stage = Math.max(stage, 2);
      if (text.includes("ROUTE CACHE RESTORED")) routeMap.classList.add("visible");
      if (text.includes("82%")) stage = Math.max(stage, 3);
      if (text.includes("SWARM ACCESS LAYER DETECTED")) stage = Math.max(stage, 4);
      if (text.includes("ACTIVE CHANNELS: ENGAGING")) stage = Math.max(stage, 5);
      if (text.includes("100%")) stage = Math.max(stage, 6);
      if (text.includes("IMAGE FRAME RECOVERED")) surveillanceFrame.classList.add("visible");
      if (text.includes("BOEING ROUTE RECONSTRUCTION DETECTED")) neighborhoodMap.classList.add("visible");
      if (text === "END SEQUENCE") schedulePanelShutdown();
      if (text.includes("SYNCHRONIZATION ACTIVE")) stage = Math.max(stage, 7);
      if (text.includes("ADAPTING")) stage = Math.max(stage, 8);
      if (text.includes("WARNING") || text.includes("DETECTED") || text.includes("ACTIVE")) pulse = 1;
      revealTrace(text);
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      tick += 1;
      pulse *= 0.95;

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "rgba(3, 8, 8, 0.18)";
      ctx.fillRect(0, 0, w, h);

      const cx = w * (0.5 + Math.sin(tick * 0.006) * 0.05);
      const cy = h * (0.42 + Math.cos(tick * 0.005) * 0.05);
      const reach = Math.min(w, h) * (0.16 + stage * 0.018);
      const activeScale = Math.max(0.2, stage / 8);

      ctx.save();
      ctx.globalAlpha = 0.16 + activeScale * 0.24 + pulse * 0.16;
      ctx.strokeStyle = stage >= 5 ? "rgba(124, 199, 255, 0.32)" : "rgba(174, 247, 210, 0.22)";
      ctx.lineWidth = 1;

      for (let i = 0; i < nodes.length; i += 1) {
        const n = nodes[i];
        n.a += n.s * (0.7 + activeScale * 2.2);
        const pull = stage >= 4 ? Math.sin(tick * 0.012 + i) * 22 * activeScale : 0;
        n.px = cx + Math.cos(n.a + i * 0.17) * (n.r + pull + reach * Math.sin(i));
        n.py = cy + Math.sin(n.a * 1.2 + i * 0.11) * (n.r * 0.66 + pull);
      }

      for (let i = 0; i < nodes.length; i += 1) {
        for (let j = i + 1; j < nodes.length; j += 1) {
          const a = nodes[i];
          const b = nodes[j];
          const dx = a.px - b.px;
          const dy = a.py - b.py;
          const dist = Math.hypot(dx, dy);
          if (dist < 92 + stage * 4) {
            ctx.globalAlpha = (1 - dist / 128) * (0.08 + activeScale * 0.23);
            ctx.beginPath();
            ctx.moveTo(a.px, a.py);
            ctx.lineTo(b.px, b.py);
            ctx.stroke();
          }
        }
      }

      for (const n of nodes) {
        const glow = stage >= 7 ? 4.4 : 2.6;
        ctx.globalAlpha = n.o * (0.38 + activeScale * 0.52);
        ctx.fillStyle = stage >= 5 ? "#7cc7ff" : "#aef7d2";
        ctx.beginPath();
        ctx.arc(n.px, n.py, 1.3 + activeScale * glow + pulse * 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      if (stage >= 6) {
        ctx.globalAlpha = 0.22 + pulse * 0.3;
        ctx.strokeStyle = "rgba(255, 207, 113, 0.42)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(cx, cy, reach * 1.5, reach * 0.82, Math.sin(tick * 0.006) * 0.3, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
      requestAnimationFrame(draw);
    }

    function speedFor(text) {
      if (text === "." || text === ".." || text === "...") return 240;
      if (text.startsWith("[") || text.startsWith("WARNING")) return 520;
      if (text === "> SYSTEM READY" || text === "END SEQUENCE") return 760;
      return 360;
    }

    function schedulePanelShutdown() {
      window.setTimeout(() => panelShutdown.classList.add("active"), 900);
    }

    async function run() {
      stage = 0;
      routeMap.classList.remove("visible");
      surveillanceFrame.classList.remove("visible");
      neighborhoodMap.classList.remove("visible");
      panelShutdown.classList.remove("active");
      traceItems.forEach((item) => item.classList.remove("visible"));
      stream.replaceChildren();
      await new Promise((resolve) => setTimeout(resolve, 400));
      for (const text of sequence) {
        addLine(text);
        await new Promise((resolve) => setTimeout(resolve, speedFor(text)));
      }
      await new Promise((resolve) => setTimeout(resolve, 1200));
      stage = 8;
    }

    window.addEventListener("resize", resize);
    resize();
    draw();
    run();
  </script>
</body>
</html>
