<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086">
  <defs>
    <pattern id="deckgrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 L0 0 L0 22" fill="none" stroke="#ececec" stroke-width="1"/>
    </pattern>
    <pattern id="grate" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 0 L18 18 M18 0 L0 18" stroke="#d9d9d9" stroke-width="1.2"/>
    </pattern>
    <style>
      .page{fill:#fbfbfa}
      .ghost{fill:#f8f8f6;stroke:#d0d0d0;stroke-width:3;stroke-dasharray:14 8}
      .deck{fill:url(#deckgrid);stroke:#111;stroke-width:7;stroke-linejoin:miter}
      .edge{fill:none;stroke:#111;stroke-width:7;stroke-linejoin:miter}
      .void{fill:#f7f7f7;stroke:#111;stroke-width:4;stroke-dasharray:10 7}
      .bearing{stroke:#111;stroke-width:9;fill:none;stroke-linecap:square}
      .rail{stroke:#111;stroke-width:4;fill:none}
      .railpost{fill:#111}
      .scaffold{fill:url(#grate);stroke:#111;stroke-width:5;stroke-linejoin:miter}
      .cage{fill:#fff;stroke:#111;stroke-width:3}
      .mesh{stroke:#111;stroke-width:1.4;fill:none;opacity:.75}
      .case{fill:#fff;stroke:#111;stroke-width:2.5}
      .speaker{fill:#111;stroke:#111;stroke-width:2}
      .speakercone{fill:#fff;stroke:#111;stroke-width:2}
      .lift{fill:#fff;stroke:#111;stroke-width:6}
      .liftline{stroke:#111;stroke-width:3;fill:none}
      .shadow{fill:#f1f1f1;stroke:none}
    </style>
  </defs>

  <rect class="page" width="1448" height="1086"/>

